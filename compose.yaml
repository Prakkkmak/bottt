name: le-cercle-local
services:
  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - cercle-db:/var/lib/postgresql
      - ./.docker/init.sql:/docker-entrypoint-initdb.d/10-cercle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: bonjour@cercle.test
      GOTRUE_SMTP_SENDER_NAME: Blood on Breizh
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_RATE_LIMIT_TOKEN_VERIFICATIONS: 30
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_SESSIONS_TIMEBOX: 720h
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://host.docker.internal:3000/code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://host.docker.internal:3000/code.html
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_SERVER_PORT: 3000
  gateway:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    depends_on: [auth,rest]
    ports: ["127.0.0.1:54321:8000"]
    volumes: ["./.docker/kong.yml:/config/kong.yml:ro"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /config/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors,key-auth
      KONG_NGINX_WORKER_PROCESSES: 1
      KONG_PROXY_ACCESS_LOG: "off"
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    restart: unless-stopped
    ports: ["127.0.0.1:54324:8025","127.0.0.1:54325:1025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
  studio:
    image: public.ecr.aws/supabase/studio:2026.01.27-sha-2a37755
    restart: unless-stopped
    depends_on: [meta,gateway]
    ports: ["127.0.0.1:55433:3000"]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ${LOCAL_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${LOCAL_SERVICE_KEY}
      AUTH_JWT_SECRET: ${LOCAL_JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: Blood on Breizh
      DEFAULT_PROJECT_NAME: Développement local
      NEXT_PUBLIC_ENABLE_LOGS: "false"
volumes:
  cercle-db:

project_id = "le-cercle-clocktower"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55432
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 30
token_verifications = 30
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.sessions]
timebox = "720h"
[auth.email.template.magic_link]
subject = "Ton code pour Le Cercle"
content_path = "./supabase/templates/code.html"
[auth.email.template.confirmation]
subject = "Bienvenue dans Le Cercle"
content_path = "./supabase/templates/code.html"
[edge_runtime]
enabled = false
[analytics]
enabled = false

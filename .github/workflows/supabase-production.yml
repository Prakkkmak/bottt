name: Supabase — migrations de production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer les migrations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: '2.119.0'

      - name: Appliquer les migrations en attente
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for secret in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Ajoute le secret $secret dans Settings > Environments > Production > Environment secrets."
              exit 1
            fi
          done

          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID doit contenir la référence du projet, sans URL."
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          supabase db push --dry-run --skip-vault
          # Only pending migrations: no local seed data, reset, or Auth configuration.
          supabase db push --yes --skip-vault
          supabase migration list
          echo "Les migrations de production sont à jour." >> "$GITHUB_STEP_SUMMARY"
